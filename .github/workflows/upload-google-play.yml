name: Upload Android to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track'
        required: true
        type: choice
        options:
          - production
          - open_testing
          - closed_testing
        default: production
      rollout:
        description: 'Staged rollout percentage (production only, 1-100)'
        required: false
        default: '10'
      releaseTag:
        description: 'Annotated tag (e.g. android-release/v1.2.3) whose message holds the What''s New text. Leave empty to publish without release notes.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: a shallow fetch can leave an annotated tag's
          # message unreadable if its commit falls outside the shallow window,
          # and the release-notes tag may point anywhere in history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply patches
        run: node_modules/.bin/patch-package

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode upload keystore
        env: 
          MYAPP_UPLOAD_KEYSTORE: ${{ secrets.MYAPP_UPLOAD_KEYSTORE }}
        run: |
          echo "$MYAPP_UPLOAD_KEYSTORE" | base64 --decode > android/app/upload.jks

      - name: Create config.json
        env:
          GOOGLE_PROJECT_NUMBER: ${{ secrets.GOOGLE_PROJECT_NUMBER }} 
        run: |
          mkdir -p config
          echo '{"GOOGLE_PROJECT_NUMBER":"$GOOGLE_PROJECT_NUMBER"}' > config/config.json

      - name: Build release AAB
        working-directory: android
        env:
          MYAPP_UPLOAD_STORE_FILE: upload.jks
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
          # Without this the manifest ships an empty com.google.android.geo.API_KEY and
          # Street View shows a black screen on every released build. The Gradle build now
          # fails rather than substituting an empty key, so this must stay set.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          ./gradlew clean bundleRelease

      # Maps the friendly choice in the workflow_dispatch UI to the track
      # names the Play Developer API actually expects, and decides whether
      # a staged rollout (userFraction) applies.
      - name: Resolve release parameters
        id: release_params
        run: |
          case "${{ github.event.inputs.track }}" in
            production)
              echo "play_track=production" >> "$GITHUB_OUTPUT"
              if [ "${{ github.event.inputs.rollout }}" = "100" ]; then
                # The Play Developer API requires 0 < userFraction < 1, so a full
                # rollout must be a "completed" release with no userFraction at all
                # rather than an "inProgress" release staged at fraction 1.0.
                echo "status=completed" >> "$GITHUB_OUTPUT"
                echo "user_fraction=" >> "$GITHUB_OUTPUT"
              else
                echo "status=inProgress" >> "$GITHUB_OUTPUT"
                FRACTION=$(awk "BEGIN { printf \"%.2f\", ${{ github.event.inputs.rollout }}/100 }")
                echo "user_fraction=$FRACTION" >> "$GITHUB_OUTPUT"
              fi
              ;;
            open_testing)
              echo "play_track=beta" >> "$GITHUB_OUTPUT"
              echo "status=completed" >> "$GITHUB_OUTPUT"
              echo "user_fraction=" >> "$GITHUB_OUTPUT"
              ;;
            closed_testing)
              echo "play_track=alpha" >> "$GITHUB_OUTPUT"
              echo "status=completed" >> "$GITHUB_OUTPUT"
              echo "user_fraction=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # The releaseTag input's message holds the What's New text (see scripts/release-android.js).
      # An empty releaseTag means "publish without release notes" — this step is skipped and
      # whatsNewDirectory is left empty below, so the action doesn't touch Play's what's-new field.
      - name: Prepare release notes
        id: release_notes
        if: github.event.inputs.releaseTag != ''
        run: |
          mkdir -p whatsnew/whatsnew-en-US
          git tag -l --format='%(contents)' "${{ github.event.inputs.releaseTag }}" > whatsnew/whatsnew-en-US/whatsnew
          echo "has_notes=true" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play (staged rollout)
        if: steps.release_params.outputs.user_fraction != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.incyclist.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.release_params.outputs.play_track }}
          status: ${{ steps.release_params.outputs.status }}
          userFraction: ${{ steps.release_params.outputs.user_fraction }}
          whatsNewDirectory: ${{ steps.release_notes.outputs.has_notes == 'true' && 'whatsnew' || '' }}

      - name: Upload to Google Play (testing track)
        if: steps.release_params.outputs.user_fraction == ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.incyclist.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.release_params.outputs.play_track }}
          status: ${{ steps.release_params.outputs.status }}
          whatsNewDirectory: ${{ steps.release_notes.outputs.has_notes == 'true' && 'whatsnew' || '' }}

      # Keeps "tag exists" strictly meaning "reached Play" — a failed build/upload must not
      # leave a stale release marker behind for the next release-notes draft to run from.
      - name: Delete release tag on failure
        if: failure() && github.event.inputs.releaseTag != ''
        run: |
          git push origin --delete "${{ github.event.inputs.releaseTag }}" || true
